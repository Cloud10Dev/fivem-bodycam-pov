<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BODYCAM LIVE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="hud">
    <div class="noise"></div><div class="vignette"></div><div class="scanlines"></div>
    <div class="frame frame-tl"></div><div class="frame frame-tr"></div><div class="frame frame-bl"></div><div class="frame frame-br"></div>
    <header><div class="brand"><span class="green-dot"></span><b id="title">BODYCAM</b><em>LIVE</em></div><div class="rec"><span></span> REC</div></header>
    <div class="meta"><span>CAM 01</span><span id="direction">N</span><span>1080P</span></div>
    <div class="crosshair"><i></i></div>
    <div class="panel"><div><label>UNIT</label><b id="unit">UNIT-0</b></div><div class="location"><label>LOCATION</label><b id="street">UNKNOWN</b></div><div class="speed"><label>SPEED</label><b id="speed">0 KM/H</b></div></div>
    <footer><span id="timestamp">0000-00-00 00:00:00 UTC</span><span class="ok"><i></i> SYSTEM NORMAL</span></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
