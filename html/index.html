<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bodycam HUD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="hud" aria-hidden="true">
    <div class="scanlines"></div>
    <div class="top-row"><span id="title">BODYCAM</span><span class="rec"><i></i> REC</span></div>
    <div class="reticle">+</div>
    <div class="bottom-row"><span id="unit">UNIT-0</span><span id="street">UNKNOWN</span><span id="speed">0 KM/H</span></div>
    <div class="timestamp" id="timestamp">0000-00-00 00:00:00 UTC</div>
  </main>
  <script src="app.js"></script>
</body>
</html>
